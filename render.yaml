services:
  - type: web
    name: bladex-l-bot
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python3 bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MAX_FILE_MB
        value: "8"
      - key: JOB_TIMEOUT
        value: "600"
      - key: MAX_CONCURRENT
        value: "2"
